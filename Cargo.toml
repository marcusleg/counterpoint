[package]
name = "counterpoint"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Markdown editor with an LLM sparring partner and ghostwriter"
license = "MIT"
repository = "https://github.com/marcusleg/counterpoint"
readme = "README.md"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sourceview5 = { version = "0.11", features = ["v5_12"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# RPM for the GitHub releases, built by `cargo generate-rpm` after `cargo build --release`
# (.github/workflows/release.yml). The shared libraries are found automatically; the versions
# below make installation fail clearly on a distribution that is too old.
[package.metadata.generate-rpm]
require-sh = false
assets = [
    { source = "target/release/counterpoint", dest = "/usr/bin/counterpoint", mode = "755" },
    { source = "data/de.marcusleg.Counterpoint.desktop", dest = "/usr/share/applications/", mode = "644" },
    { source = "data/de.marcusleg.Counterpoint.metainfo.xml", dest = "/usr/share/metainfo/", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/de.marcusleg.Counterpoint.svg", dest = "/usr/share/icons/hicolor/scalable/apps/", mode = "644" },
]

[package.metadata.generate-rpm.requires]
gtk4 = ">= 4.18"
libadwaita = ">= 1.8"
gtksourceview5 = ">= 5.12"

[dev-dependencies]
mockito = "1"
tempfile = "3"

[[test]]
name = "gtk_editor"
harness = false

[[test]]
name = "gtk_window"
harness = false
