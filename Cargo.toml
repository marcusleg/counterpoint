[package]
name = "counterpoint"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Markdown editor with an LLM sparring partner and ghostwriter"
license = "MIT"
publish = false

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10"

[dev-dependencies]
mockito = "1"
tempfile = "3"
